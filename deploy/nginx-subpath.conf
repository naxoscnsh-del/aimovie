# 把下面两段加进 ainewimage.com 的 server { ... } 里（和其他 location 并列），然后：
#   nginx -t && nginx -s reload
# 端口 8010 要和 .env 里的 APP_PORT 一致

location = /movie { return 301 /movie/; }

location /movie/ {
    proxy_pass http://127.0.0.1:8010;          # 注意：这里不要以 / 结尾，路径要原样转发
    proxy_set_header Host $host;               # 必须：否则写操作会被当成跨站请求拒绝
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;                       # 实时进度推送（SSE）
    proxy_read_timeout 3600s;
    client_max_body_size 30m;                  # 参考图 / BGM 上传
}
