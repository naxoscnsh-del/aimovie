name: vendor-vue
# 手动触发：把指定版本的 Vue 3 浏览器版放进仓库，国内服务器构建时不需要访问 CDN
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Vue 版本（如 3.5）"
        default: "3.5"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch vue.global.prod.js
        run: |
          set -eux
          mkdir -p /tmp/v && cd /tmp/v
          npm pack "vue@${{ inputs.version }}"
          tar xzf vue-*.tgz
          VER=$(node -p "require('./package/package.json').version")
          mkdir -p "$GITHUB_WORKSPACE/web/static/vendor"
          cp package/dist/vue.global.prod.js "$GITHUB_WORKSPACE/web/static/vendor/vue.global.prod.js"
          cp package/LICENSE "$GITHUB_WORKSPACE/web/static/vendor/VUE_LICENSE" || true
          echo "$VER" > "$GITHUB_WORKSPACE/web/static/vendor/VUE_VERSION"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/static/vendor
          git diff --cached --quiet && exit 0
          git commit -m "vendor: Vue $(cat web/static/vendor/VUE_VERSION)"
          git push
